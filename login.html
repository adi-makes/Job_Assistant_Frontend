<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Job Assistant</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>
    <div class="auth-container">
        <!-- Sidebar (Left) -->
        <div class="auth-sidebar">
            <h2>Welcome back!</h2>
            <p>
                Continue your journey to<br>your dream career.
            </p>
        </div>

        <!-- Form (Right) -->
        <div class="auth-form-container">
            <div class="auth-form-box">
                <div class="auth-header">
                    <h1>Log in to your account</h1>
                </div>

                <form action="#" method="POST" id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Your username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Password" required>
                    </div>

                    <div class="form-footer" style="display: flex; justify-content: space-between;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Log In</button>

                    <div style="margin-top: 15px; text-align: center; font-size: 0.9rem;">
                        Don't have an account? <a href="signup.html" style="color: var(--primary-color);">Sign Up</a>.
                    </div>
                </form>
            </div>
        </div>
        </form>
    </div>
    </div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Login Form Handler
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');

            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    // Get form values
                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value;

                    // Validate inputs
                    if (!username || !password) {
                        Auth.showError(loginForm, 'Please enter both username and password');
                        return;
                    }

                    // Show loading state
                    const btn = loginForm.querySelector('button[type="submit"]');
                    const originalText = btn.innerText;
                    btn.innerText = 'Logging In...';
                    btn.disabled = true;

                    try {
                        // Call API
                        const result = await Auth.login(username, password);

                        if (result.success) {
                            Auth.showSuccess(loginForm, 'Login successful! Redirecting...');
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 1000);
                        } else {
                            // Show error message
                            Auth.showError(loginForm, result.error);
                            btn.innerText = originalText;
                            btn.disabled = false;
                        }
                    } catch (error) {
                        console.error('Login error:', error);
                        Auth.showError(loginForm, 'An unexpected error occurred. Please try again.');
                        btn.innerText = originalText;
                        btn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>

</html>
