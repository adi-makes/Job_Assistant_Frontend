<body>
    <!-- Header Removed -->

    <div class="preferences-container">
        <!-- Progress -->
        <div class="progress-bar-container">
            <div class="progress-bar" style="width: 50%;"></div>
        </div>

        <div class="preferences-header">
            <h1>What type of role are you<br>looking for?</h1>
            <p>Select all that apply.</p>
        </div>

        <div class="options-grid" id="roleTypeGrid">
            <div class="option-card" data-value="full-time">

                <div class="option-label">Full-time</div>
            </div>
            <div class="option-card" data-value="part-time">
                <div class="option-icon">🕒</div>
                <div class="option-label">Part-time</div>
            </div>
            <div class="option-card" data-value="contract">
                <div class="option-icon">📄</div>
                <div class="option-label">Contract</div>
            </div>
            <div class="option-card" data-value="internship">
                <div class="option-icon">🎓</div>
                <div class="option-label">Internship</div>
            </div>
            <div class="option-card" data-value="freelance">
                <div class="option-icon">💻</div>
                <div class="option-label">Freelance</div>
            </div>
        </div>
    </div>

    <footer class="preferences-footer">
        <div class="container footer-content">
